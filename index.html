<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ants-incremental</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Ant Colony</h1>
  <div class="readouts">
    <div class="readout" id="readoutReserves"><b data-value>0</b><i>reserves</i></div>
    <div class="readout"><b id="valFood">0</b><i>food</i></div>
    <div class="readout"><b id="valRate">0/s</b><i>food per second</i></div>
    <div class="readout"><b id="valPop">0 / 0</b><i>population</i></div>
    <div class="readout"><b id="valEggs">0</b><i>eggs incubating</i></div>
    <div class="readout"><b id="valTime">0s</b><i>colony age</i></div>
  </div>
</header>

<main>
  <section class="panel" id="queenPanel">
    <h2>The queen</h2>
    <p id="queenText"></p>
    <button id="btnShed">Shed her wings</button>
  </section>

  <section class="panel" id="broodPanel" hidden>
    <h2>Brood</h2>
    <p id="eggCost"></p>
    <div class="lay-buttons">
      <button id="btnLay">Lay an egg</button>
      <button id="btnLay10">Lay ×10</button>
      <button id="btnLayMax">Lay max</button>
    </div>
    <div id="casteChoice"></div>
    <p class="egg-summary" id="eggSummary"></p>
    <span class="bar"><i id="eggBar"></i></span>
  </section>

  <section class="panel" id="colonyPanel" hidden>
    <h2>Colony</h2>
    <ul id="casteList"></ul>
  </section>

  <section class="panel" id="upgradePanel" hidden>
    <h2>Upgrades <span class="tally" id="upgradeOwned"></span></h2>
    <p id="upgradeEmpty">Nothing new to adapt — grow a caste further.</p>
    <div id="upgradeList"></div>
  </section>

  <section class="panel" id="achievementPanel" hidden>
    <h2>Achievements <span class="tally" id="achievementLevel"></span></h2>
    <p id="achievementPoints"></p>
    <span class="bar"><i id="achievementBar"></i></span>
    <p class="bonus" id="achievementBonus"></p>
    <ul id="achievementList"></ul>
  </section>
</main>

<script type="module" src="js/ui.js"></script>
</body>
</html>
